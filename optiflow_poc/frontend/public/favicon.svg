<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43417C" />
      <stop offset="100%" stop-color="#3B237B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCB09" />
      <stop offset="100%" stop-color="#ffe16b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Base App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)" />
  
  <!-- Outer Eye Shape (Vision) -->
  <path d="M 64 256 C 64 256, 164 128, 256 128 C 348 128, 448 256, 448 256 C 448 256, 348 384, 256 384 C 164 384, 64 256, 64 256 Z" fill="#ffffff" opacity="0.95" filter="url(#shadow)" />
  
  <!-- Pupil Base (Gold) -->
  <circle cx="256" cy="256" r="90" fill="url(#goldGrad)" />
  
  <!-- Pupil Ring -->
  <circle cx="256" cy="256" r="90" stroke="#3B237B" stroke-width="12" fill="none" />
  
  <!-- Inner Data Flow / Bar Chart (OptiFlow Data) -->
  <rect x="206" y="246" width="20" height="40" rx="8" fill="#3B237B" />
  <rect x="246" y="206" width="20" height="80" rx="8" fill="#3B237B" />
  <rect x="286" y="226" width="20" height="60" rx="8" fill="#3B237B" />
</svg>